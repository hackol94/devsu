# Project information
sonar.projectName=siigo-qa-playwrigth-api-e2e
sonar.projectKey=siigo-qa-playwrigth-api-e2e
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Organization configuration (using environment variable)
sonar.organization=${env.SONAR_ORGANIZATION}

# Host configuration (using environment variable)
sonar.host.url=${env.SONAR_URL}

# Authentication (using environment variable)
sonar.login=${env.SONAR_TOKEN}

# Sources and analysis configuration
sonar.sources=src
sonar.inclusions=src/**/*.ts

# Test configuration
sonar.tests=test
sonar.test.inclusions=test/**/*.spec.ts,test/**/*.property.spec.ts

# Coverage configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Coverage exclusions
sonar.coverage.exclusions=**/*.spec.ts,**/*.property.spec.ts,**/*.test.ts,**/test/**,**/mock/**,**/models/**,**/resources/**,**/*.d.ts,**/types/**

# General exclusions
sonar.exclusions=**/node_modules/**,**/target/**,**/test-results/**,**/coverage/**,**/patches/**,**/resources/data/**,**/resources/beneficiarios/**,**/resources/loadfiles/**,**/*.json,**/*.feature

# Language
sonar.language=ts

# Duplication exclusions
sonar.cpd.exclusions=**/models/**,**/resources/**,**/test/**
